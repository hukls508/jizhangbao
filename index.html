<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>记账宝 - 简单好用的记账工具</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: #f5f7f5;
  color: #333;
  min-height: 100vh;
  padding-bottom: 70px;
}
:root {
  --primary: #2e7d32;
  --primary-light: #4caf50;
  --primary-lighter: #e8f5e9;
  --primary-dark: #1b5e20;
  --expense: #e53935;
  --income: #2e7d32;
  --text: #333;
  --text-light: #999;
  --border: #e0e0e0;
  --bg: #f5f7f5;
  --card: #fff;
}
.header {
  background: linear-gradient(135deg, #2e7d32, #4caf50);
  color: #fff;
  padding: 20px 16px 16px;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(46,125,50,0.2);
}
.header h1 { font-size: 20px; font-weight: 600; }
.header .subtitle { font-size: 12px; opacity: 0.85; margin-top: 2px; }
.page { display: none; padding: 12px; }
.page.active { display: block; }
.card {
  background: var(--card);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.type-toggle {
  display: flex;
  background: var(--primary-lighter);
  border-radius: 25px;
  padding: 4px;
  margin-bottom: 20px;
}
.type-toggle button {
  flex: 1;
  padding: 10px;
  border: none;
  background: transparent;
  border-radius: 22px;
  font-size: 15px;
  font-weight: 600;
  color: var(--primary);
  cursor: pointer;
  transition: all 0.3s;
}
.type-toggle button.active {
  background: var(--primary);
  color: #fff;
  box-shadow: 0 2px 8px rgba(46,125,50,0.3);
}
.amount-section { text-align: center; margin-bottom: 20px; }
.amount-label { font-size: 14px; color: var(--text-light); margin-bottom: 8px; }
.amount-input {
  font-size: 42px;
  font-weight: 700;
  color: var(--text);
  border: none;
  background: transparent;
  width: 100%;
  text-align: center;
  outline: none;
}
.amount-input.expense { color: var(--expense); }
.amount-input.income { color: var(--income); }
.amount-unit { font-size: 18px; color: var(--text-light); }
.category-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px 8px;
  margin-bottom: 20px;
}
.category-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  padding: 8px 4px;
  border-radius: 10px;
  transition: all 0.2s;
}
.category-item:active { transform: scale(0.92); }
.category-item .icon {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--primary-lighter);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  margin-bottom: 6px;
  transition: all 0.2s;
}
.category-item.active .icon {
  background: var(--primary);
  transform: scale(1.1);
}
.category-item .name { font-size: 12px; color: var(--text); }
.category-item.active .name { color: var(--primary); font-weight: 600; }
.input-row {
  display: flex;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}
.input-row label { width: 60px; font-size: 14px; color: var(--text-light); }
.input-row input {
  flex: 1;
  border: none;
  font-size: 15px;
  outline: none;
  color: var(--text);
  background: transparent;
}
.save-btn {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #2e7d32, #4caf50);
  color: #fff;
  border: none;
  border-radius: 25px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(46,125,50,0.3);
  transition: all 0.2s;
}
.save-btn:active { transform: scale(0.98); }
.search-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.search-input {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 14px;
  outline: none;
  background: var(--card);
  transition: border-color 0.2s;
}
.search-input:focus { border-color: var(--primary); }
.filter-select {
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 14px;
  outline: none;
  background: var(--card);
  color: var(--text);
  cursor: pointer;
}
.summary-bar {
  display: flex;
  justify-content: space-around;
  padding: 16px;
  background: linear-gradient(135deg, #2e7d32, #4caf50);
  color: #fff;
  border-radius: 12px;
  margin-bottom: 12px;
}
.summary-item { text-align: center; }
.summary-item .label { font-size: 12px; opacity: 0.85; }
.summary-item .value { font-size: 18px; font-weight: 700; margin-top: 4px; }
.bill-date-group { margin-bottom: 12px; }
.bill-date-header {
  display: flex;
  justify-content: space-between;
  padding: 8px 4px;
  font-size: 13px;
  color: var(--text-light);
}
.bill-date-header .day-total { font-weight: 600; }
.bill-item {
  display: flex;
  align-items: center;
  padding: 12px 40px 12px 12px;
  background: var(--card);
  border-radius: 10px;
  margin-bottom: 6px;
  position: relative;
  cursor: pointer;
  transition: background 0.15s;
}
.bill-item:active { background: var(--primary-lighter); }
.bill-item .cat-icon {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--primary-lighter);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  margin-right: 12px;
}
.bill-item .bill-info { flex: 1; min-width: 0; }
.bill-item .cat-name { font-size: 15px; font-weight: 500; }
.bill-item .bill-note {
  font-size: 12px;
  color: var(--text-light);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.bill-item .bill-amount {
  font-size: 17px;
  font-weight: 700;
  flex-shrink: 0;
}
.bill-item .bill-amount.expense { color: var(--expense); }
.bill-item .bill-amount.income { color: var(--income); }
.bill-item .delete-btn {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  background: var(--primary-lighter);
  border: none;
  color: var(--primary);
  font-size: 18px;
  cursor: pointer;
  padding: 4px 10px;
  border-radius: 6px;
  opacity: 0.7;
  transition: all 0.2s;
  line-height: 1;
  font-weight: bold;
  z-index: 2;
}
.bill-item .delete-btn:hover { opacity: 1; background: var(--expense); color: #fff; }
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-light);
}
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; }
.stats-overview {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  margin-bottom: 12px;
}
.stats-card {
  background: var(--card);
  border-radius: 12px;
  padding: 14px 10px;
  text-align: center;
}
.stats-card .label { font-size: 12px; color: var(--text-light); }
.stats-card .value { font-size: 18px; font-weight: 700; margin-top: 6px; }
.stats-card .value.expense { color: var(--expense); }
.stats-card .value.income { color: var(--income); }
.stats-card .value.balance { color: var(--primary); }
.chart-container {
  background: var(--card);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
}
.chart-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: var(--text); }
.chart-wrapper { position: relative; height: 220px; }
.time-selector {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 12px;
  gap: 12px;
}
.time-selector .view-toggle {
  display: flex;
  background: var(--primary-lighter);
  border-radius: 20px;
  padding: 3px;
}
.time-selector .view-toggle button {
  padding: 6px 14px;
  border: none;
  background: transparent;
  border-radius: 18px;
  font-size: 13px;
  font-weight: 600;
  color: var(--primary);
  cursor: pointer;
  transition: all 0.2s;
}
.time-selector .view-toggle button.active { background: var(--primary); color: #fff; }
.time-selector .nav-btn {
  background: var(--primary-lighter);
  border: none;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  font-size: 16px;
  color: var(--primary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.time-selector .time-text {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  min-width: 90px;
  text-align: center;
}
.rank-item {
  display: flex;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid #f0f0f0;
}
.rank-item:last-child { border-bottom: none; }
.rank-item .rank-num {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--primary-lighter);
  color: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 600;
  margin-right: 10px;
}
.rank-item .rank-icon { font-size: 20px; margin-right: 10px; }
.rank-item .rank-name { flex: 1; font-size: 14px; }
.rank-item .rank-amount { font-size: 14px; font-weight: 600; color: var(--expense); }
.rank-item .rank-percent { font-size: 12px; color: var(--text-light); margin-left: 8px; width: 40px; text-align: right; }
.profile-header {
  text-align: center;
  padding: 20px;
  background: linear-gradient(135deg, #2e7d32, #4caf50);
  color: #fff;
  border-radius: 12px;
  margin-bottom: 12px;
}
.profile-header .avatar {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  margin: 0 auto 10px;
}
.profile-header .name { font-size: 18px; font-weight: 600; }
.profile-header .desc { font-size: 12px; opacity: 0.85; margin-top: 4px; }
.menu-list { background: var(--card); border-radius: 12px; overflow: hidden; margin-bottom: 12px; }
.menu-item {
  display: flex;
  align-items: center;
  padding: 14px 16px;
  border-bottom: 1px solid #f0f0f0;
  cursor: pointer;
  transition: background 0.2s;
}
.menu-item:last-child { border-bottom: none; }
.menu-item:active { background: var(--primary-lighter); }
.menu-item .menu-icon { font-size: 20px; margin-right: 12px; }
.menu-item .menu-text { flex: 1; font-size: 15px; }
.menu-item .menu-arrow { color: var(--text-light); font-size: 14px; }
.menu-item .menu-value { font-size: 14px; color: var(--text-light); margin-right: 6px; }
.budget-section { margin-bottom: 12px; }
.budget-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.budget-header .title { font-size: 15px; font-weight: 600; }
.budget-header .edit-btn {
  font-size: 13px;
  color: var(--primary);
  cursor: pointer;
  background: none;
  border: none;
}
.budget-bar {
  height: 10px;
  background: #e0e0e0;
  border-radius: 5px;
  overflow: hidden;
  margin-bottom: 8px;
}
.budget-fill {
  height: 100%;
  background: linear-gradient(90deg, #4caf50, #2e7d32);
  border-radius: 5px;
  transition: width 0.5s;
}
.budget-fill.warning { background: linear-gradient(90deg, #ff9800, #f57c00); }
.budget-fill.danger { background: linear-gradient(90deg, #ef5350, #e53935); }
.budget-info {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--text-light);
}
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #fff;
  display: flex;
  justify-content: space-around;
  align-items: center;
  border-top: 1px solid var(--border);
  z-index: 100;
  height: 60px;
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 60px;
  cursor: pointer;
  color: var(--text-light);
  transition: color 0.2s;
}
.nav-item.active { color: var(--primary); }
.nav-item .nav-icon { font-size: 22px; line-height: 1; }
.nav-item .nav-text { font-size: 11px; margin-top: 3px; }
.nav-item.add-btn {
  position: relative;
  flex: 0 0 60px;
  height: 60px;
}
.nav-item.add-btn .nav-icon {
  position: absolute;
  top: -26px;
  left: 50%;
  transform: translateX(-50%);
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: linear-gradient(135deg, #2e7d32, #4caf50);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
  font-weight: 900;
  line-height: 1;
  box-shadow: 0 6px 16px rgba(46,125,50,0.5), 0 2px 6px rgba(0,0,0,0.2);
  border: 4px solid #fff;
}
.modal-mask {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  align-items: center;
  justify-content: center;
}
.modal-mask.show { display: flex; }
.modal {
  background: #fff;
  border-radius: 16px;
  width: 85%;
  max-width: 340px;
  padding: 20px;
  max-height: 85vh;
  overflow-y: auto;
}
.modal h3 { font-size: 17px; margin-bottom: 16px; text-align: center; }
.modal .form-group { margin-bottom: 14px; }
.modal .form-group label {
  display: block;
  font-size: 13px;
  color: var(--text-light);
  margin-bottom: 6px;
}
.modal input, .modal select {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 15px;
  outline: none;
  background: #fff;
}
.modal input:focus, .modal select:focus { border-color: var(--primary); }
.modal .type-toggle-sm {
  display: flex;
  background: var(--primary-lighter);
  border-radius: 20px;
  padding: 3px;
  margin-bottom: 14px;
}
.modal .type-toggle-sm button {
  flex: 1;
  padding: 8px;
  border: none;
  background: transparent;
  border-radius: 18px;
  font-size: 14px;
  font-weight: 600;
  color: var(--primary);
  cursor: pointer;
  transition: all 0.2s;
}
.modal .type-toggle-sm button.active { background: var(--primary); color: #fff; }
.modal .cat-grid-sm {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px 4px;
  margin-bottom: 14px;
}
.modal .cat-item-sm {
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  padding: 6px 2px;
  border-radius: 8px;
  transition: all 0.15s;
}
.modal .cat-item-sm .cat-icon-sm {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--primary-lighter);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  margin-bottom: 4px;
  transition: all 0.15s;
}
.modal .cat-item-sm.active .cat-icon-sm { background: var(--primary); transform: scale(1.08); }
.modal .cat-item-sm .cat-name-sm { font-size: 10px; color: var(--text); }
.modal .cat-item-sm.active .cat-name-sm { color: var(--primary); font-weight: 600; }
.modal-btns { display: flex; gap: 10px; margin-top: 6px; }
.modal-btns button {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  cursor: pointer;
  font-weight: 600;
}
.modal-btns .cancel { background: #f0f0f0; color: var(--text); }
.modal-btns .confirm { background: var(--primary); color: #fff; }
.achievements-section { margin-bottom: 12px; }
.achievements-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.achievements-header .title { font-size: 16px; font-weight: 600; }
.achievements-header .streak {
  font-size: 13px;
  color: var(--primary);
  background: var(--primary-lighter);
  padding: 4px 10px;
  border-radius: 12px;
  font-weight: 600;
}
.achievements-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
.achievement-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 6px;
  border-radius: 10px;
  background: #fafafa;
  position: relative;
  transition: all 0.3s;
}
.achievement-item.unlocked {
  background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
  box-shadow: 0 2px 8px rgba(46,125,50,0.15);
}
.achievement-item .ach-icon {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  margin-bottom: 8px;
  background: #e0e0e0;
  filter: grayscale(100%);
  opacity: 0.5;
  transition: all 0.3s;
  position: relative;
  border: 2px solid #ccc;
}
.achievement-item.unlocked .ach-icon { filter: grayscale(0%); opacity: 1; }
.achievement-item.unlocked.level-1 .ach-icon {
  background: linear-gradient(135deg, #d4a574, #b8860b);
  border-color: #cd853f;
  box-shadow: 0 2px 8px rgba(205,133,63,0.3);
  animation: badge-glow 2.5s ease-in-out infinite;
}
.achievement-item.unlocked.level-2 .ach-icon {
  background: linear-gradient(135deg, #e8e8e8, #c0c0c0);
  border-color: #a8a8a8;
  box-shadow: 0 2px 10px rgba(192,192,192,0.4);
  animation: badge-glow 2.2s ease-in-out infinite;
}
.achievement-item.unlocked.level-3 .ach-icon {
  background: linear-gradient(135deg, #ffd700, #daa520);
  border-color: #ffb700;
  box-shadow: 0 2px 12px rgba(255,215,0,0.4);
  animation: badge-glow 2s ease-in-out infinite;
}
.achievement-item.unlocked.level-4 .ach-icon {
  background: linear-gradient(135deg, #50c878, #2e8b57);
  border-color: #3cb371;
  box-shadow: 0 2px 14px rgba(80,200,120,0.5);
  animation: badge-bounce 1.8s ease-in-out infinite;
}
.achievement-item.unlocked.level-5 .ach-icon {
  background: linear-gradient(135deg, #4169e1, #1e90ff);
  border-color: #00bfff;
  box-shadow: 0 0 15px rgba(65,105,225,0.5), 0 0 30px rgba(30,144,255,0.2);
  animation: badge-bounce 1.5s ease-in-out infinite;
}
.achievement-item.unlocked.level-6 .ach-icon {
  background: linear-gradient(135deg, #9370db, #8a2be2);
  border-color: #ba55d3;
  box-shadow: 0 0 18px rgba(147,112,219,0.6), 0 0 35px rgba(138,43,226,0.3);
  animation: badge-rotate 2s linear infinite;
}
.achievement-item.unlocked.level-6 .ach-icon::after {
  content: '✨';
  position: absolute;
  top: -6px;
  right: -4px;
  font-size: 14px;
  animation: star-twinkle 1s ease-in-out infinite;
}
.achievement-item.unlocked.level-7 .ach-icon {
  background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff, #9b59b6, #ff6b6b);
  background-size: 300% 300%;
  border-color: #ffd700;
  border-width: 3px;
  box-shadow: 0 0 20px rgba(255,215,0,0.8), 0 0 40px rgba(255,140,0,0.4), 0 0 60px rgba(255,69,0,0.2);
  animation: legendary-badge 1.5s ease-in-out infinite, rainbow-bg 3s linear infinite;
}
.achievement-item.unlocked.level-7 .ach-icon::before {
  content: '⭐';
  position: absolute;
  top: -8px;
  left: -4px;
  font-size: 12px;
  animation: star-twinkle 0.8s ease-in-out infinite;
}
.achievement-item.unlocked.level-7 .ach-icon::after {
  content: '✨';
  position: absolute;
  top: -6px;
  right: -6px;
  font-size: 16px;
  animation: star-twinkle 1.2s ease-in-out infinite 0.4s;
}
@keyframes badge-glow {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}
@keyframes badge-bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}
@keyframes badge-rotate {
  0% { transform: rotate(-3deg); }
  50% { transform: rotate(3deg); }
  100% { transform: rotate(-3deg); }
}

}

}

.achievement-item.unlocked .ach-desc { color: var(--text-light); }

</head>
<body>
<div class="header">
  <h1 id="pageTitle">记账宝</h1>
  <div class="subtitle" id="pageSubtitle">简单好用的记账工具</div>
</div>

<div class="page active" id="page-add">
  <div class="card">
    <div class="type-toggle">
      <button class="active" data-type="expense" onclick="setType('expense')">支出</button>
      <button data-type="income" onclick="setType('income')">收入</button>
    </div>
    <div class="amount-section">
      <div class="amount-label">金额</div>
      <div>
        <span class="amount-unit">¥</span>
        <input type="number" class="amount-input expense" id="amountInput" placeholder="0.00" step="0.01" inputmode="decimal">
      </div>
    </div>
    <div class="category-grid" id="categoryGrid"></div>
    <div class="input-row">
      <label>备注</label>
      <input type="text" id="noteInput" placeholder="添加备注（可选）" maxlength="50">
    </div>
    <div class="input-row">
      <label>日期</label>
      <input type="date" id="dateInput">
    </div>
    <button class="save-btn" onclick="saveBill()">保存记账</button>
  </div>
</div>

<div class="page" id="page-bills">
  <div class="search-bar">
    <input type="text" class="search-input" id="searchInput" placeholder="搜索备注或分类..." oninput="updateBillList()">
    <select class="filter-select" id="filterType" onchange="updateBillList()">
      <option value="all">全部</option>
      <option value="expense">支出</option>
      <option value="income">收入</option>
    </select>
  </div>
  <div class="summary-bar">
    <div class="summary-item">
      <div class="label">本月支出</div>
      <div class="value" id="monthExpense">0</div>
    </div>
    <div class="summary-item">
      <div class="label">本月收入</div>
      <div class="value" id="monthIncome">0</div>
    </div>
    <div class="summary-item">
      <div class="label">结余</div>
      <div class="value" id="monthBalance">0</div>
    </div>
  </div>
  <div id="billList"></div>
</div>

<div class="page" id="page-stats">
  <div class="time-selector">
    <button class="nav-btn" onclick="changeTime(-1)">‹</button>
    <span class="time-text" id="statsTimeText">2026年9月</span>
    <button class="nav-btn" onclick="changeTime(1)">›</button>
  </div>
  <div class="time-selector">
    <div class="view-toggle">
      <button class="active" id="viewMonthBtn" onclick="setStatsView('month')">月度</button>
      <button id="viewYearBtn" onclick="setStatsView('year')">年度</button>
    </div>
  </div>
  <div class="stats-overview">
    <div class="stats-card">
      <div class="label">支出</div>
      <div class="value expense" id="statsExpense">0</div>
    </div>
    <div class="stats-card">
      <div class="label">收入</div>
      <div class="value income" id="statsIncome">0</div>
    </div>
    <div class="stats-card">
      <div class="label">结余</div>
      <div class="value balance" id="statsBalance">0</div>
    </div>
  </div>
  <div class="chart-container">
    <div class="chart-title">支出分类占比</div>
    <div class="chart-wrapper"><canvas id="pieChart"></canvas></div>
  </div>
  <div class="chart-container">
    <div class="chart-title" id="trendChartTitle">近6个月收支趋势</div>
    <div class="chart-wrapper"><canvas id="trendChart"></canvas></div>
  </div>
  <div class="chart-container">
    <div class="chart-title">支出排行</div>
    <div id="rankList"></div>
  </div>
</div>

<div class="page" id="page-me">
  <div class="profile-header">
    <div class="avatar">💰</div>
    <div class="name">记账宝用户</div>
    <div class="desc">已坚持记账 <span id="totalDays">0</span> 天 · 共 <span id="totalBills">0</span> 笔</div>
  </div>
  <div class="card budget-section">
    <div class="budget-header">
      <span class="title">本月预算</span>
      <button class="edit-btn" onclick="showBudgetModal()">设置</button>
    </div>
    <div class="budget-bar"><div class="budget-fill" id="budgetFill" style="width:0%"></div></div>
    <div class="budget-info">
      <span>已用 <span id="budgetUsed">0</span></span>
      <span>预算 <span id="budgetTotal">0</span></span>
    </div>
  </div>
  <div class="card achievements-section">
    <div class="achievements-header">
      <span class="title">🏆 记账成就</span>
      <span class="streak">连续 <span id="streakDays">0</span> 天</span>
    </div>
    <div class="achievements-grid" id="achievementsGrid"></div>
    <div class="achievement-progress" id="achievementProgress">
      <div class="progress-text">
        <span id="nextAchievement">下一个成就</span>
        <span id="achievementProgressText">0/7天</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="achievementProgressFill" style="width:0%"></div></div>
    </div>
  </div>
  <div class="menu-list">
    <div class="menu-item" onclick="exportData()">
      <span class="menu-icon">📤</span>
      <span class="menu-text">导出JSON数据</span>
      <span class="menu-arrow">›</span>
    </div>
    <div class="menu-item" onclick="exportCSV()">
      <span class="menu-icon">📊</span>
      <span class="menu-text">导出CSV表格</span>
      <span class="menu-arrow">›</span>
    </div>
    <div class="menu-item" onclick="document.getElementById('importFile').click()">
      <span class="menu-icon">📥</span>
      <span class="menu-text">导入数据</span>
      <span class="menu-arrow">›</span>
    </div>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
  </div>
  <div class="menu-list">
    <div class="menu-item" onclick="clearAllData()">
      <span class="menu-icon">🗑️</span>
      <span class="menu-text" style="color:#e53935">清空所有数据</span>
      <span class="menu-arrow">›</span>
    </div>
  </div>
  <div class="menu-list">
    <div class="menu-item" onclick="showAbout()">
      <span class="menu-icon">ℹ️</span>
      <span class="menu-text">关于记账宝</span>
      <span class="menu-value">v2.0</span>
      <span class="menu-arrow">›</span>
    </div>
  </div>
</div>

<div class="bottom-nav">
  <div class="nav-item" onclick="switchPage('bills', this)">
    <span class="nav-icon">📋</span>
    <span class="nav-text">账单</span>
  </div>
  <div class="nav-item" onclick="switchPage('stats', this)">
    <span class="nav-icon">📊</span>
    <span class="nav-text">统计</span>
  </div>
  <div class="nav-item add-btn" onclick="switchPage('add', this)">
    <span class="nav-icon">＋</span>
  </div>
  <div class="nav-item" onclick="switchPage('me', this)">
    <span class="nav-icon">👤</span>
    <span class="nav-text">我的</span>
  </div>
</div>

<div class="stats-footer">
  <span>👀 总访问 <span id="busuanzi_value_site_pv">0</span> 次</span>
  <span>👤 访客 <span id="busuanzi_value_site_uv">0</span> 人</span>
</div>

<div class="modal-mask" id="budgetModal">
  <div class="modal">
    <h3>设置月度预算</h3>
    <div class="form-group">
      <input type="number" id="budgetInput" placeholder="请输入预算金额" step="0.01">
    </div>
    <div class="modal-btns">
      <button class="cancel" onclick="hideBudgetModal()">取消</button>
      <button class="confirm" onclick="saveBudget()">确定</button>
    </div>
  </div>
</div>

<div class="modal-mask" id="editModal">
  <div class="modal">
    <h3>编辑账单</h3>
    <div class="type-toggle-sm">
      <button id="editTypeExpense" class="active" onclick="setEditType('expense')">支出</button>
      <button id="editTypeIncome" onclick="setEditType('income')">收入</button>
    </div>
    <div class="form-group">
      <label>金额</label>
      <input type="number" id="editAmount" placeholder="0.00" step="0.01" inputmode="decimal">
    </div>
    <div class="form-group">
      <label>分类</label>
      <div class="cat-grid-sm" id="editCategoryGrid"></div>
    </div>
    <div class="form-group">
      <label>备注</label>
      <input type="text" id="editNote" placeholder="添加备注（可选）" maxlength="50">
    </div>
    <div class="form-group">
      <label>日期</label>
      <input type="date" id="editDate">
    </div>
    <div class="modal-btns">
      <button class="cancel" onclick="hideEditModal()">取消</button>
      <button class="confirm" onclick="saveEdit()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'jizhangbao_data';
let data = { bills: [], budget: 0 };

function loadData() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) data = JSON.parse(saved);
  } catch(e) { console.error('加载数据失败', e); }
  if (!data.bills) data.bills = [];
  if (!data.budget) data.budget = 0;
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

const categories = {
  expense: [
    { name: '餐饮', icon: '🍜' },
    { name: '交通', icon: '🚗' },
    { name: '购物', icon: '🛒' },
    { name: '娱乐', icon: '🎮' },
    { name: '医疗', icon: '💊' },
    { name: '居住', icon: '🏠' },
    { name: '教育', icon: '📚' },
    { name: '通讯', icon: '📱' },
    { name: '服饰', icon: '👔' },
    { name: '其他', icon: '📦' }
  ],
  income: [
    { name: '工资', icon: '💰' },
    { name: '奖金', icon: '🎁' },
    { name: '投资', icon: '📈' },
    { name: '兼职', icon: '💼' },
    { name: '红包', icon: '🧧' },
    { name: '退款', icon: '↩️' },
    { name: '其他', icon: '📦' }
  ]
};

let currentType = 'expense';
let selectedCategory = null;
let statsTimeOffset = 0;
let statsView = 'month';
let pieChart = null;
let trendChart = null;
let editingBillId = null;
let editType = 'expense';
let editCategory = null;

function init() {
  loadData();
  renderCategories();
  document.getElementById('dateInput').value = todayStr();
  updateBillList();
  updateBudgetDisplay();
  updateTotalDays();
  renderAchievements();
  document.querySelector('.nav-item.add-btn').classList.add('active');
}

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function switchPage(page, navEl) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if (navEl) navEl.classList.add('active');
  const titles = {
    add: { title: '记一笔', subtitle: '3秒完成记账' },
    bills: { title: '账单明细', subtitle: '每一笔都清清楚楚' },
    stats: { title: '统计分析', subtitle: '钱花哪了一目了然' },
    me: { title: '我的', subtitle: '个性化设置' }
  };
  document.getElementById('pageTitle').textContent = titles[page].title;
  document.getElementById('pageSubtitle').textContent = titles[page].subtitle;
  if (page === 'bills') updateBillList();
  if (page === 'stats') renderStats();
  if (page === 'me') { updateBudgetDisplay(); updateTotalDays(); renderAchievements(); }
  if (page === 'add') {
    setTimeout(() => document.getElementById('amountInput').focus(), 100);
  }
}

function setType(type) {
  currentType = type;
  selectedCategory = null;
  document.querySelectorAll('.type-toggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.type === type);
  });
  const amountInput = document.getElementById('amountInput');
  amountInput.classList.toggle('expense', type === 'expense');
  amountInput.classList.toggle('income', type === 'income');
  renderCategories();
}

function renderCategories() {
  const grid = document.getElementById('categoryGrid');
  grid.innerHTML = categories[currentType].map((cat, i) => `
    <div class="category-item ${selectedCategory === cat.name ? 'active' : ''}" onclick="selectCategory('${cat.name}')">
      <div class="icon">${cat.icon}</div>
      <div class="name">${cat.name}</div>
    </div>
  `).join('');
}

function selectCategory(name) {
  selectedCategory = name;
  renderCategories();
}

function saveBill() {
  const amount = parseFloat(document.getElementById('amountInput').value);
  const note = document.getElementById('noteInput').value.trim();
  const date = document.getElementById('dateInput').value;
  if (!amount || amount <= 0) { showToast('请输入金额'); return; }
  if (!selectedCategory) { showToast('请选择分类'); return; }
  if (!date) { showToast('请选择日期'); return; }
  const cat = categories[currentType].find(c => c.name === selectedCategory);
  data.bills.unshift({
    id: Date.now().toString(),
    type: currentType,
    amount: amount,
    category: selectedCategory,
    icon: cat.icon,
    note: note,
    date: date
  });
  saveData();
  showToast('记账成功！');
  renderAchievements();
  document.getElementById('amountInput').value = '';
  document.getElementById('noteInput').value = '';
  selectedCategory = null;
  renderCategories();
  document.getElementById('amountInput').focus();
}

function updateBillList() {
  const list = document.getElementById('billList');
  const now = new Date();
  const monthPrefix = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const searchText = document.getElementById('searchInput').value.trim().toLowerCase();
  const filterType = document.getElementById('filterType').value;
  let monthExp = 0, monthInc = 0;
  data.bills.forEach(b => {
    if (b.date.startsWith(monthPrefix)) {
      if (b.type === 'expense') monthExp += b.amount;
      else monthInc += b.amount;
    }
  });
  document.getElementById('monthExpense').textContent = '¥' + monthExp.toFixed(2);
  document.getElementById('monthIncome').textContent = '¥' + monthInc.toFixed(2);
  document.getElementById('monthBalance').textContent = '¥' + (monthInc - monthExp).toFixed(2);
  let filteredBills = data.bills;
  if (filterType !== 'all') {
    filteredBills = filteredBills.filter(b => b.type === filterType);
  }
  if (searchText) {
    filteredBills = filteredBills.filter(b => 
      (b.note && b.note.toLowerCase().includes(searchText)) ||
      (b.category && b.category.toLowerCase().includes(searchText))
    );
  }
  if (filteredBills.length === 0) {
    const isEmpty = data.bills.length === 0;
    list.innerHTML = isEmpty 
      ? `<div class="empty-state"><div class="icon">📝</div><p>还没有账单，快去记一笔吧</p></div>`
      : `<div class="empty-state"><div class="icon">🔍</div><p>没有找到匹配的账单</p></div>`;
    return;
  }
  const groups = {};
  filteredBills.forEach(b => {
    if (!groups[b.date]) groups[b.date] = [];
    groups[b.date].push(b);
  });
  let html = '';
  Object.keys(groups).sort((a,b) => b.localeCompare(a)).forEach(date => {
    const bills = groups[date];
    const dayExp = bills.filter(b => b.type === 'expense').reduce((s,b) => s + b.amount, 0);
    const dayInc = bills.filter(b => b.type === 'income').reduce((s,b) => s + b.amount, 0);
    const d = new Date(date);
    const weekDays = ['周日','周一','周二','周三','周四','周五','周六'];
    const dateStr = `${d.getMonth()+1}月${d.getDate()}日 ${weekDays[d.getDay()]}`;
    html += `<div class="bill-date-group">
      <div class="bill-date-header">
        <span>${dateStr}</span>
        <span class="day-total">${dayInc > 0 ? '收¥'+dayInc.toFixed(2)+' ' : ''}支¥${dayExp.toFixed(2)}</span>
      </div>`;
    bills.forEach(b => {
      html += `<div class="bill-item" onclick="editBill('${b.id}')">
        <div class="cat-icon">${b.icon}</div>
        <div class="bill-info">
          <div class="cat-name">${b.category}</div>
          ${b.note ? `<div class="bill-note">${escapeHtml(b.note)}</div>` : ''}
        </div>
        <div class="bill-amount ${b.type}">${b.type === 'expense' ? '-' : '+'}¥${b.amount.toFixed(2)}</div>
        <button class="delete-btn" onclick="event.stopPropagation(); deleteBill('${b.id}')">×</button>
      </div>`;
    });
    html += '</div>';
  });
  list.innerHTML = html;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function deleteBill(id) {
  if (!confirm('确定删除这条记录吗？')) return;
  data.bills = data.bills.filter(b => b.id !== id);
  saveData();
  updateBillList();
  renderAchievements();
  showToast('已删除');
}

function editBill(id) {
  const bill = data.bills.find(b => b.id === id);
  if (!bill) return;
  editingBillId = id;
  editType = bill.type;
  editCategory = bill.category;
  document.getElementById('editAmount').value = bill.amount;
  document.getElementById('editNote').value = bill.note || '';
  document.getElementById('editDate').value = bill.date;
  document.getElementById('editTypeExpense').classList.toggle('active', bill.type === 'expense');
  document.getElementById('editTypeIncome').classList.toggle('active', bill.type === 'income');
  renderEditCategories();
  document.getElementById('editModal').classList.add('show');
}

function setEditType(type) {
  editType = type;
  editCategory = null;
  document.getElementById('editTypeExpense').classList.toggle('active', type === 'expense');
  document.getElementById('editTypeIncome').classList.toggle('active', type === 'income');
  renderEditCategories();
}

function renderEditCategories() {
  const grid = document.getElementById('editCategoryGrid');
  grid.innerHTML = categories[editType].map(cat => `
    <div class="cat-item-sm ${editCategory === cat.name ? 'active' : ''}" onclick="selectEditCategory('${cat.name}')">
      <div class="cat-icon-sm">${cat.icon}</div>
      <div class="cat-name-sm">${cat.name}</div>
    </div>
  `).join('');
}

function selectEditCategory(name) {
  editCategory = name;
  renderEditCategories();
}

function hideEditModal() {
  document.getElementById('editModal').classList.remove('show');
  editingBillId = null;
}

function saveEdit() {
  if (!editingBillId) return;
  const amount = parseFloat(document.getElementById('editAmount').value);
  const note = document.getElementById('editNote').value.trim();
  const date = document.getElementById('editDate').value;
  if (!amount || amount <= 0) { showToast('请输入金额'); return; }
  if (!editCategory) { showToast('请选择分类'); return; }
  if (!date) { showToast('请选择日期'); return; }
  const cat = categories[editType].find(c => c.name === editCategory);
  const index = data.bills.findIndex(b => b.id === editingBillId);
  if (index !== -1) {
    data.bills[index] = {
      ...data.bills[index],
      type: editType,
      amount: amount,
      category: editCategory,
      icon: cat.icon,
      note: note,
      date: date
    };
    saveData();
    updateBillList();
    renderAchievements();
    showToast('修改成功');
  }
  hideEditModal();
}

function setStatsView(view) {
  statsView = view;
  statsTimeOffset = 0;
  document.getElementById('viewMonthBtn').classList.toggle('active', view === 'month');
  document.getElementById('viewYearBtn').classList.toggle('active', view === 'year');
  document.getElementById('trendChartTitle').textContent = view === 'month' ? '近6个月收支趋势' : '近6年收支趋势';
  renderStats();
}

function changeTime(delta) {
  statsTimeOffset += delta;
  renderStats();
}

function renderStats() {
  const now = new Date();
  if (statsView === 'month') {
    now.setMonth(now.getMonth() + statsTimeOffset);
    const monthPrefix = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
    document.getElementById('statsTimeText').textContent = `${now.getFullYear()}年${now.getMonth()+1}月`;
    const monthBills = data.bills.filter(b => b.date.startsWith(monthPrefix));
    renderStatsData(monthBills);
    const labels = [], expData = [], incData = [];
    for (let i = 5; i >= 0; i--) {
      const d = new Date();
      d.setMonth(d.getMonth() + statsTimeOffset - i);
      const prefix = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      labels.push(`${d.getMonth()+1}月`);
      const mb = data.bills.filter(b => b.date.startsWith(prefix));
      expData.push(mb.filter(b => b.type === 'expense').reduce((s,b) => s + b.amount, 0));
      incData.push(mb.filter(b => b.type === 'income').reduce((s,b) => s + b.amount, 0));
    }
    renderTrendChart(labels, expData, incData);
  } else {
    now.setFullYear(now.getFullYear() + statsTimeOffset);
    const yearPrefix = `${now.getFullYear()}-`;
    document.getElementById('statsTimeText').textContent = `${now.getFullYear()}年`;
    const yearBills = data.bills.filter(b => b.date.startsWith(yearPrefix));
    renderStatsData(yearBills);
    const labels = [], expData = [], incData = [];
    for (let i = 5; i >= 0; i--) {
      const d = new Date();
      d.setFullYear(d.getFullYear() + statsTimeOffset - i);
      const prefix = `${d.getFullYear()}-`;
      labels.push(`${d.getFullYear()}`);
      const yb = data.bills.filter(b => b.date.startsWith(prefix));
      expData.push(yb.filter(b => b.type === 'expense').reduce((s,b) => s + b.amount, 0));
      incData.push(yb.filter(b => b.type === 'income').reduce((s,b) => s + b.amount, 0));
    }
    renderTrendChart(labels, expData, incData);
  }
}

function renderStatsData(bills) {
  const exp = bills.filter(b => b.type === 'expense');
  const inc = bills.filter(b => b.type === 'income');
  const expTotal = exp.reduce((s,b) => s + b.amount, 0);
  const incTotal = inc.reduce((s,b) => s + b.amount, 0);
  document.getElementById('statsExpense').textContent = '¥' + expTotal.toFixed(2);
  document.getElementById('statsIncome').textContent = '¥' + incTotal.toFixed(2);
  document.getElementById('statsBalance').textContent = '¥' + (incTotal - expTotal).toFixed(2);
  const catStats = {};
  exp.forEach(b => { catStats[b.category] = (catStats[b.category] || 0) + b.amount; });
  const catEntries = Object.entries(catStats).sort((a,b) => b[1] - a[1]);
  if (pieChart) pieChart.destroy();
  const ctx1 = document.getElementById('pieChart').getContext('2d');
  if (catEntries.length > 0) {
    pieChart = new Chart(ctx1, {
      type: 'doughnut',
      data: {
        labels: catEntries.map(e => e[0]),
        datasets: [{
          data: catEntries.map(e => e[1]),
          backgroundColor: ['#f8bbd0','#ffcc80','#fff59d','#c5e1a5','#80cbc4','#81d4fa','#9fa8da','#ce93d8','#f48fb1','#bcaaa4'],
          borderWidth: 2,
          borderColor: '#fff'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'right', labels: { font: { size: 11 }, boxWidth: 12 } }
        }
      }
    });
  } else {
    ctx1.clearRect(0,0,ctx1.canvas.width,ctx1.canvas.height);
    ctx1.font = '14px sans-serif';
    ctx1.fillStyle = '#999';
    ctx1.textAlign = 'center';
    ctx1.fillText('暂无支出数据', ctx1.canvas.width/2, ctx1.canvas.height/2);
  }
  const rankList = document.getElementById('rankList');
  if (catEntries.length === 0) {
    rankList.innerHTML = '<div style="text-align:center;color:#999;padding:20px;">暂无数据</div>';
  } else {
    rankList.innerHTML = catEntries.slice(0, 8).map((e, i) => {
      const cat = categories.expense.find(c => c.name === e[0]) || { icon: '📦' };
      const percent = expTotal > 0 ? ((e[1] / expTotal) * 100).toFixed(1) : 0;
      return `<div class="rank-item">
        <span class="rank-num">${i+1}</span>
        <span class="rank-icon">${cat.icon}</span>
        <span class="rank-name">${e[0]}</span>
        <span class="rank-amount">¥${e[1].toFixed(2)}</span>
        <span class="rank-percent">${percent}%</span>
      </div>`;
    }).join('');
  }
}

function renderTrendChart(labels, expData, incData) {
  if (trendChart) trendChart.destroy();
  trendChart = new Chart(document.getElementById('trendChart').getContext('2d'), {
    type: 'line',
    data: {
      labels: labels,
      datasets: [
        { label: '支出', data: expData, borderColor: '#e53935', backgroundColor: 'rgba(229,57,53,0.1)', fill: true, tension: 0.3 },
        { label: '收入', data: incData, borderColor: '#2e7d32', backgroundColor: 'rgba(46,125,50,0.1)', fill: true, tension: 0.3 }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { labels: { font: { size: 11 }, boxWidth: 12 } } },
      scales: { y: { beginAtZero: true, ticks: { font: { size: 10 } } }, x: { ticks: { font: { size: 10 } } } }
    }
  });
}

function showBudgetModal() {
  document.getElementById('budgetInput').value = data.budget || '';
  document.getElementById('budgetModal').classList.add('show');
}

function hideBudgetModal() {
  document.getElementById('budgetModal').classList.remove('show');
}

function saveBudget() {
  const val = parseFloat(document.getElementById('budgetInput').value);
  if (val && val > 0) {
    data.budget = val;
    saveData();
    updateBudgetDisplay();
    showToast('预算设置成功');
  }
  hideBudgetModal();
}

function updateBudgetDisplay() {
  const now = new Date();
  const monthPrefix = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const used = data.bills.filter(b => b.date.startsWith(monthPrefix) && b.type === 'expense').reduce((s,b) => s + b.amount, 0);
  document.getElementById('budgetUsed').textContent = '¥' + used.toFixed(2);
  document.getElementById('budgetTotal').textContent = data.budget ? '¥' + data.budget.toFixed(2) : '未设置';
  const fill = document.getElementById('budgetFill');
  if (data.budget > 0) {
    const percent = Math.min((used / data.budget) * 100, 100);
    fill.style.width = percent + '%';
    fill.classList.remove('warning', 'danger');
    if (percent >= 100) fill.classList.add('danger');
    else if (percent >= 80) fill.classList.add('warning');
  } else {
    fill.style.width = '0%';
  }
}

function exportData() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `记账宝数据_${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('JSON数据已导出');
}

function exportCSV() {
  if (data.bills.length === 0) {
    showToast('暂无数据可导出');
    return;
  }
  const headers = ['日期', '类型', '分类', '金额', '备注'];
  const rows = data.bills.map(b => [
    b.date,
    b.type === 'expense' ? '支出' : '收入',
    b.category,
    b.amount.toFixed(2),
    b.note || ''
  ]);
  let csvContent = '\uFEFF' + headers.join(',') + '\n';
  rows.forEach(row => {
    csvContent += row.map(cell => {
      if (typeof cell === 'string' && (cell.includes(',') || cell.includes('"') || cell.includes('\n'))) {
        return '"' + cell.replace(/"/g, '""') + '"';
      }
      return cell;
    }).join(',') + '\n';
  });
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `记账宝账单_${todayStr()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('CSV表格已导出');
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      if (imported.bills && Array.isArray(imported.bills)) {
        if (confirm(`确定导入 ${imported.bills.length} 条账单数据吗？将覆盖现有数据。`)) {
          data = imported;
          if (!data.budget) data.budget = 0;
          saveData();
          updateBillList();
          updateBudgetDisplay();
          updateTotalDays();
          renderAchievements();
          showToast('导入成功');
        }
      } else {
        showToast('文件格式不正确');
      }
    } catch(err) {
      showToast('文件解析失败');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function clearAllData() {
  if (!confirm('确定要清空所有数据吗？此操作不可恢复！')) return;
  if (!confirm('再次确认：真的要删除全部记账数据吗？')) return;
  data = { bills: [], budget: 0 };
  saveData();
  updateBillList();
  updateBudgetDisplay();
  updateTotalDays();
  renderAchievements();
  showToast('数据已清空');
}

function updateTotalDays() {
  if (data.bills.length === 0) {
    document.getElementById('totalDays').textContent = '0';
    document.getElementById('totalBills').textContent = '0';
    return;
  }
  const dates = new Set(data.bills.map(b => b.date));
  document.getElementById('totalDays').textContent = dates.size;
  document.getElementById('totalBills').textContent = data.bills.length;
}

const ACHIEVEMENTS = [
  { days: 7, icon: '🪙', name: '初露锋芒', desc: '连续记账7天', level: 1 },
  { days: 30, icon: '💰', name: '崭露头角', desc: '连续记账30天', level: 2 },
  { days: 90, icon: '🐷', name: '小有所成', desc: '连续记账3个月', level: 3 },
  { days: 150, icon: '🏦', name: '日积月累', desc: '连续记账5个月', level: 4 },
  { days: 180, icon: '💎', name: '半程巅峰', desc: '连续记账6个月', level: 5 },
  { days: 240, icon: '🏯', name: '记账宗师', desc: '连续记账8个月', level: 6 },
  { days: 365, icon: '👑', name: '年度传奇', desc: '连续记账一整年', level: 7 }
];

function calcStreakDays() {
  if (data.bills.length === 0) return 0;
  const dates = new Set(data.bills.map(b => b.date));
  let streak = 0;
  const today = new Date();
  for (let i = 0; i < 400; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if (dates.has(dateStr)) {
      streak++;
    } else {
      break;
    }
  }
  return streak;
}

function renderAchievements() {
  const streak = calcStreakDays();
  document.getElementById('streakDays').textContent = streak;
  const grid = document.getElementById('achievementsGrid');
  grid.innerHTML = ACHIEVEMENTS.map(ach => {
    const unlocked = streak >= ach.days;
    return `<div class="achievement-item ${unlocked ? 'unlocked' : ''} level-${ach.level}">
      <span class="ach-lock">🔒</span>
      <span class="ach-check">✅</span>
      <div class="ach-icon">${ach.icon}</div>
      <div class="ach-name">${ach.name}</div>
      <div class="ach-desc">${ach.desc}</div>
    </div>`;
  }).join('');
  const nextAch = ACHIEVEMENTS.find(a => streak < a.days);
  const progressDiv = document.getElementById('achievementProgress');
  if (nextAch) {
    const prevDays = ACHIEVEMENTS.find(a => a.days < nextAch.days) ? ACHIEVEMENTS.filter(a => a.days < nextAch.days).pop().days : 0;
    const progress = Math.min(((streak - prevDays) / (nextAch.days - prevDays)) * 100, 100);
    document.getElementById('nextAchievement').textContent = `距「${nextAch.name}」还需${nextAch.days - streak}天`;
    document.getElementById('achievementProgressText').textContent = `${streak}/${nextAch.days}天`;
    document.getElementById('achievementProgressFill').style.width = progress + '%';
    progressDiv.style.display = 'block';
  } else {
    document.getElementById('nextAchievement').textContent = '🎉 已解锁全部成就！';
    document.getElementById('achievementProgressText').textContent = '传奇达成';
    document.getElementById('achievementProgressFill').style.width = '100%';
  }
}

}

  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

document.querySelectorAll('.modal-mask').forEach(mask => {
  mask.addEventListener('click', function(e) {
    if (e.target === this) {
      this.classList.remove('show');
      if (this.id === 'editModal') editingBillId = null;
    }
